name: Klassenkompass veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Öffentliche Version bauen
        run: npm run build:public

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Website-Paket hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
